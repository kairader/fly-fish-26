        - heading "The Rivers You’ve Heard About" [level=2] [ref=e20]
        - paragraph [ref=e22]: Montana wrote the playbook. The Madison. The Yellowstone. The Missouri. These rivers have been on magazine covers for decades because they deliver. Blue-ribbon trout water through valleys with snow-capped peaks and golden grass. More fish per mile than almost anywhere on earth. Yes, it’s more popular than Wyoming. But the rivers are vast, the guide scene is sharp, and the towns — Bozeman and Livingston — have the best food and bars in the Northern Rockies. This is the full experience, dialed in.
