          - heading "Bozeman & Livingston" [level=2] [ref=e118]
        - paragraph [ref=e120]: Two towns, two speeds, 25 minutes apart. Bozeman is polished — a booming college town with walkable downtown, strong restaurants, and real energy. Livingston is the soul. A railroad town where the wind blows hard and the bars stay open late. Anthony Bourdain ranked the Murray Hotel in his top 10. Grittier, weirder, more Montana.
