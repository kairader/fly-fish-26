        - heading "The Wyoming Nobody Talks About" [level=2] [ref=e20]
        - paragraph [ref=e22]: Wyoming means Yellowstone crowds and Jackson Hole prices to most people. But against the Bighorn Mountains, there’s a fly fishing scene that’s stayed off the radar. Sheridan still feels like the Old West — ranchers in pearl snaps, bars with taxidermy on the walls, a main street you can walk end to end in ten minutes. The fishing? Private water access, open meadows packed with eager trout, and the Bighorn River two hours south. This is fly fishing before it got curated for Instagram. Raw, uncrowded, loaded with fish.
