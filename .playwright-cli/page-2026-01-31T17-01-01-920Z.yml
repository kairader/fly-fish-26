          - heading "Sheridan, Wyoming" [level=2] [ref=e86]
        - paragraph [ref=e88]: "Sheridan isn’t trying to be anything. A working ranching town at 3,700 feet, backed by mountains, with brick storefronts, saddleries, and bars that have poured whiskey since Prohibition ended. After a day on the water: walk to dinner, hit a brewery, end up somewhere the locals actually drink. No velvet ropes. No $18 cocktails. Cold beer, good food, loud stories."
